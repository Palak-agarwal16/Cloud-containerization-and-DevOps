version: '3'

services:

  postgres_db:
    build: ./database
    container_name: postgres_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      macvlan_net:
        ipv4_address: 192.168.50.10

  node_backend:
    build: ./backend
    container_name: node_backend
    depends_on:
      - postgres_db
    ports:
      - "3000:3000"
    networks:
      macvlan_net:
        ipv4_address: 192.168.50.20

volumes:
  pgdata:

networks:
  macvlan_net:
    external: true
